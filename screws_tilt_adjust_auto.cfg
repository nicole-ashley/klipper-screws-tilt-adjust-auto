# Screws Tilt Adjust Auto: a "Level bed screws" button for Mainsail, Fluidd
# and KlipperScreen.
#
# Add this to printer.cfg:
#   [include screws_tilt_adjust_auto.cfg]
#
# Running LEVEL_BED_SCREWS opens a dialog to pick how to level. It needs
# Klipper's [respond] section, which most configs already have.
#
# This file is updated with the extra, so don't edit it. To change it, copy
# it under another name and include that instead.

[gcode_macro LEVEL_BED_SCREWS]
description: Choose how to level the bed screws
gcode:
  {% if 'respond' not in printer.configfile.settings %}
    {action_raise_error("LEVEL_BED_SCREWS needs a [respond] section in printer.cfg")}
  {% endif %}

  # Continuous mode is only offered when there's an eddy current probe
  {% set ns = namespace(eddy=false, heating=[]) %}
  {% for section in printer.configfile.settings %}
    {% if section.startswith('probe_eddy_current') %}
      {% set ns.eddy = true %}
    {% endif %}
  {% endfor %}

  # Heaters with a target set, shown as "Bed 41/60°C"
  {% for name in printer.heaters.available_heaters %}
    {% set heater = printer[name] %}
    {% if heater.target > 0 %}
      {% set label = name.split(' ')[-1]|replace('heater_bed', 'bed')|replace('_', ' ')|capitalize %}
      {% set ns.heating = ns.heating + ['%s %d/%d°C' % (label, heater.temperature, heater.target)] %}
    {% endif %}
  {% endfor %}

  RESPOND TYPE=command MSG="action:prompt_begin Level bed screws"
  {% if ns.heating %}
    RESPOND TYPE=command MSG="action:prompt_text {ns.heating|join(', ')}. If the heaters are still warming up, it levels now and again once they reach temperature."
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_text No heaters are on, so it levels once. To level hot, set heater targets first."
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_button Level|_LEVEL_BED_SCREWS_RUN MODE=standard|primary"
  RESPOND TYPE=command MSG="action:prompt_button One screw at a time|_LEVEL_BED_SCREWS_RUN MODE=one_by_one|secondary"
  {% if ns.eddy %}
    RESPOND TYPE=command MSG="action:prompt_button Continuous (eddy probe)|_LEVEL_BED_SCREWS_RUN MODE=continuous|secondary"
  {% endif %}
  # Checks each motor turns the right screw the right way
  {% if ns.eddy %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Test motors|_LEVEL_BED_SCREWS_RUN MODE=test_continuous"
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Test motors|_LEVEL_BED_SCREWS_RUN MODE=test"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_LEVEL_BED_SCREWS_CLOSE"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _LEVEL_BED_SCREWS_RUN]
description: Runs the mode picked in the LEVEL_BED_SCREWS dialog
gcode:
  {% set mode = params.MODE|default('standard')|lower %}
  RESPOND TYPE=command MSG="action:prompt_end"
  # WAIT_FOR_HEATERS=1 levels once when no heater is on or all are at
  # temperature, so it's safe to always pass. DIALOG=1 shows a dialog with a
  # Cancel button while it runs.
  {% if mode == 'test_continuous' %}
    SCREWS_TILT_ADJUST_AUTO_TEST CONTINUOUS=1 DIALOG=1
  {% elif mode == 'test' %}
    SCREWS_TILT_ADJUST_AUTO_TEST DIALOG=1
  {% elif mode == 'continuous' %}
    SCREWS_TILT_ADJUST_AUTO WAIT_FOR_HEATERS=1 CONTINUOUS=1 DIALOG=1
  {% elif mode == 'one_by_one' %}
    SCREWS_TILT_ADJUST_AUTO WAIT_FOR_HEATERS=1 ONE_BY_ONE=1 DIALOG=1
  {% else %}
    SCREWS_TILT_ADJUST_AUTO WAIT_FOR_HEATERS=1 DIALOG=1
  {% endif %}

[gcode_macro _LEVEL_BED_SCREWS_CLOSE]
description: Closes the LEVEL_BED_SCREWS dialog
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro CANCEL_LEVEL_BED_SCREWS]
description: Stop a running bed screw levelling or motor calibration
gcode:
  # While a run is going this is caught as soon as it's sent, rather than
  # waiting for the run to finish, so it only gets here when nothing is
  # running. Keep the name if you copy this file, or it won't be caught.
  SCREWS_TILT_ADJUST_AUTO_CANCEL
